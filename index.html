<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Halloween AR</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    #hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      z-index: 10; padding: 10px 18px; border-radius: 999px;
      background: rgba(20, 10, 30, .75); color: #ffb347;
      font: bold 15px/1.4 system-ui, sans-serif; white-space: nowrap;
      transition: opacity .4s;
    }
  </style>
  <script>
    // ろうそくの炎っぽく明るさをゆらす
    AFRAME.registerComponent('flicker', {
      tick(t) {
        const l = this.el.getAttribute('light');
        if (!l) return;
        const v = 1.2 + Math.sin(t / 90) * 0.25 + Math.sin(t / 37) * 0.15 + Math.random() * 0.1;
        this.el.setAttribute('light', 'intensity', v);
      }
    });
    // マーカー検出時にヒントを消す
    AFRAME.registerComponent('marker-hint', {
      init() {
        const hint = document.getElementById('hint');
        this.el.addEventListener('markerFound', () => hint.style.opacity = 0);
        this.el.addEventListener('markerLost', () => hint.style.opacity = 1);
      }
    });
  </script>
</head>
<body>
  <div id="hint">🎃 マーカーにカメラを向けてね</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           renderer="logarithmicDepthBuffer: true; antialias: true"
           arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; cameraParametersUrl: camera_para.dat;">

    <a-assets timeout="15000">
      <a-asset-item id="pumpkin" src="pumpkin.glb"></a-asset-item>
      <a-asset-item id="ghost" src="ghost.glb"></a-asset-item>
    </a-assets>

    <a-marker type="pattern" url="patt.hiro" marker-hint smooth="true" smoothCount="5">

      <!-- ===== ジャック・オ・ランタン（pumpkin.glb） ===== -->
      <a-entity position="0 0 0"
                animation="property: rotation; from: 0 -15 0; to: 0 15 0; dir: alternate; loop: true; dur: 2500; easing: easeInOutSine">
        <a-entity gltf-model="#pumpkin" scale="3.5 3.5 3.5"></a-entity>
        <!-- 中のろうそくの光 -->
        <a-entity position="0 0.4 0.8" light="type: point; color: #ffae42; intensity: 1.2; distance: 3" flicker></a-entity>
      </a-entity>

      <!-- ===== お化け1（かぼちゃの周りを回る） ===== -->
      <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
        <a-entity position="1.1 0.5 0" rotation="0 0 0"
                  animation="property: position; from: 1.1 0.3 0; to: 1.1 0.6 0; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine">
          <a-entity gltf-model="#ghost" scale="1.5 1.5 1.5"></a-entity>
        </a-entity>
      </a-entity>

      <!-- ===== お化け2（小さめ・逆回り） ===== -->
      <a-entity animation="property: rotation; from: 0 180 0; to: 0 -180 0; loop: true; dur: 12000; easing: linear">
        <a-entity position="-0.9 1.0 0" rotation="0 180 0"
                  animation="property: position; from: -0.9 0.7 0; to: -0.9 0.95 0; dir: alternate; loop: true; dur: 1100; easing: easeInOutSine">
          <a-entity gltf-model="#ghost" scale="1 1 1"></a-entity>
        </a-entity>
      </a-entity>

      <!-- 足元の影 -->
      <a-circle rotation="-90 0 0" radius="0.6" position="0 0.01 0"
                material="color: #000; opacity: 0.35; transparent: true"></a-circle>
    </a-marker>

    <a-entity light="type: ambient; color: #8877aa; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; color: #fff; intensity: 0.6" position="1 2 1"></a-entity>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
