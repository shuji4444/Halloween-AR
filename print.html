<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halloween AR 印刷用</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <style>
    @page { size: A4; margin: 12mm; }
    body { margin: 0; font-family: system-ui, sans-serif; color: #222; background: #fff; }
    .sheet { max-width: 180mm; margin: 0 auto; padding: 8mm 0; text-align: center; }
    h1 { font-size: 22pt; margin: 0 0 4mm; }
    .row { display: flex; gap: 10mm; justify-content: center; align-items: flex-start; flex-wrap: wrap; }
    .box { display: flex; flex-direction: column; align-items: center; gap: 3mm; }
    .box img, #qr svg { width: 75mm; height: 75mm; display: block; }
    .step { font-size: 13pt; font-weight: bold; }
    .note { font-size: 10pt; color: #555; margin-top: 6mm; line-height: 1.6; }
    .url { font-size: 9pt; color: #888; word-break: break-all; }
    @media print { .noprint { display: none; } }
    .noprint { margin: 6mm auto; }
  </style>
</head>
<body>
  <div class="sheet">
    <h1>🎃 Halloween AR 👻</h1>
    <div class="row">
      <div class="box">
        <div class="step">① QRをスマホで読み取る</div>
        <div id="qr"></div>
        <div class="url" id="url"></div>
      </div>
      <div class="box">
        <div class="step">② このマークにカメラを向ける</div>
        <img src="hiro.png" alt="ARマーカー">
      </div>
    </div>
    <p class="note">切り抜くときは、黒い枠の外側に白い余白を1cmほど残してください。<br>
      明るい場所で、マーカー全体が画面に入るようにすると安定します。</p>
    <button class="noprint" onclick="print()">印刷する</button>
  </div>
  <script>
    // このページと同じ場所にある index.html のURLでQRを作る
    const url = new URL('./', location.href).href;
    document.getElementById('url').textContent = url;
    const qr = qrcode(0, 'M');
    qr.addData(url);
    qr.make();
    document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
  </script>
</body>
</html>
